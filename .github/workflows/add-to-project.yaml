name: Add All Issues to Common Project

on:
  issues:
    types:
      - opened
      - reopened
      - labeled
      - transferred

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.ISSUE_MOVER_APP_ID }}
          private-key: ${{ secrets.ISSUE_MOVER_PRIVATE_KEY }}
          owner: ccbas

      - name: Add issue to project
        uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/orgs/ccbas/projects/8
          github-token: ${{ steps.app-token.outputs.token }}