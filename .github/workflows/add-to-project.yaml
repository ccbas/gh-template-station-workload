name: Add All Issues to Common Project

on:
  issues:
    types:
      - opened
      - reopened
      - labeled
      - transferred

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.ISSUE_MOVER_APP_ID }}
          private-key: ${{ secrets.ISSUE_MOVER_PRIVATE_KEY }}
          owner: ccbas

      - name: Add issue to project
        uses: actions/add-to-project@244f685bbc3b7adfa8466e08b698b5577571133e # v1.0.2
        with:
          project-url: https://github.com/orgs/ccbas/projects/8
          github-token: ${{ steps.app-token.outputs.token }}